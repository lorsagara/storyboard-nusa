<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Storyboard Prompt Generator</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
    }

    h1 {
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 14px;
      margin-bottom: 12px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
      cursor: pointer;
    }

    pre {
      margin-top: 16px;
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>Storyboard Prompt Generator</h1>
  <p>Isi prompt di bawah (bebas format):</p>

  <textarea id="prompt">
Buat storyboard sederhana
Topik: Kehidupan berang-berang di sungai
Style visual: Pixar-style 3D
Jumlah scene: 5
Aspect ratio: 9:16
Format output: JSON
  </textarea>

  <button id="generateBtn">Generate</button>

  <pre id="output">Klik Generate untuk test...</pre>

  <script>
    const btn = document.getElementById("generateBtn");
    const promptEl = document.getElementById("prompt");
    const outputEl = document.getElementById("output");

    btn.onclick = async () => {
      outputEl.textContent = "Generating...";

      try {
        const response = await fetch(
          "https://lintasnusa.lorsagara.workers.dev",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              prompt: promptEl.value
            })
          }
        );

        const text = await response.text();
        outputEl.textContent = text;

      } catch (error) {
        outputEl.textContent = "ERROR: " + error.message;
      }
    };
  </script>
</body>
</html>
