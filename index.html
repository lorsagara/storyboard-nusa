<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Storyboard Prompt Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      padding: 20px;
    }
    h1 {
      margin-bottom: 8px;
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      outline: none;
      margin-bottom: 12px;
    }
    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #38bdf8;
      color: #020617;
      font-weight: bold;
    }
    pre {
      margin-top: 16px;
      background: #020617;
      padding: 12px;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <h1>Storyboard Prompt Generator</h1>
  <p>Isi prompt di bawah (bebas format):</p>

  <textarea id="prompt">
Buat storyboard sederhana
Topik: Kehidupan berang-berang di sungai
Style visual: Pixar-style 3D
Jumlah scene: 5
Aspect ratio: 9:16
Format output: JSON
  </textarea>

  <button id="generateBtn">Generate</button>

  <pre id="output"></pre>

  <script>
    const btn = document.getElementById("generateBtn");
    const promptEl = document.getElementById("prompt");
    const outputEl = document.getElementById("output");

    btn.addEventListener("click", async () => {
      outputEl.textContent = "Generating...";

      try {
        const res = await fetch("https://lintasnusa.lorsagara.workers.dev", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt: promptEl.value
          })
        });

        const data = await res.json();
        outputEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        outputEl.textContent = "Error: " + err.message;
      }
    });
  </script>
</body>
</html>
