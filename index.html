<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Storyboard Prompt Generator</title>

<style>
body {
  font-family: system-ui, sans-serif;
  background: #0f172a;
  color: #e5e7eb;
  padding: 20px;
}
textarea {
  width: 100%;
  min-height: 160px;
  padding: 12px;
  border-radius: 8px;
}
button {
  margin-top: 12px;
  padding: 12px;
  font-size: 16px;
  border-radius: 8px;
  border: none;
  background: #38bdf8;
  font-weight: bold;
}
pre {
  margin-top: 16px;
  background: #020617;
  padding: 12px;
  border-radius: 8px;
  white-space: pre-wrap;
}
</style>
</head>

<body>
<h2>Storyboard Prompt Generator</h2>

<textarea id="prompt">
Buat storyboard sederhana
Topik: Kehidupan berang-berang di sungai
Style visual: Pixar-style 3D
Jumlah scene: 5
Aspect ratio: 9:16
Format output: JSON
</textarea>

<button onclick="generate()">Generate</button>

<pre id="output">Klik Generate…</pre>

<script>
function generate() {
  const prompt = encodeURIComponent(
    document.getElementById("prompt").value
  );

  const url =
    "https://lintasnusa.lorsagara.workers.dev?prompt=" + prompt;

  fetch(url)
    .then(r => r.text())
    .then(t => {
      document.getElementById("output").textContent = t;
    })
    .catch(e => {
      document.getElementById("output").textContent =
        "ERROR: " + e.message;
    });
}
</script>
</body>
</html>
